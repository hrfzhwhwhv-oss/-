<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ちゃいろのこびん 合奏教材</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="title-area">
      <span class="bottle">🏺</span>
      <h1>ちゃいろのこびん</h1>
      <span class="bottle">🏺</span>
    </header>

    <section class="instrument-area">
      <p class="mode-title">がっきを えらぶ</p>
      <div class="mode-buttons">
        <button class="instrument-button selected-mode" data-instrument="xylophone">🪵 もっきん</button>
        <button class="instrument-button" data-instrument="bells">🔔 ハンドベル</button>
        <button class="instrument-button" data-instrument="bass">🎹 ベース</button>
      </div>
    </section>

    <section class="mode-area">
      <p class="mode-title">れんしゅうする パート</p>

      <div id="xylophoneModeButtons" class="mode-buttons">
        <button class="part-button selected-mode" data-mode="all">🎵 ぜんぶ</button>
        <button class="part-button" data-mode="part1">① もっきん①</button>
        <button class="part-button" data-mode="part2">② もっきん②</button>
      </div>

      <div id="bellModeButtons" class="mode-buttons hidden">
        <button class="part-button" data-mode="all">🎵 ぜんぶ</button>
        <button class="part-button" data-mode="part1">① ベル①</button>
        <button class="part-button" data-mode="part2">② ベル②</button>
        <button class="part-button" data-mode="part3">③ ベル③</button>
      </div>

      <div id="bassModeButtons" class="mode-buttons hidden">
        <button class="part-button selected-mode" data-mode="bass">⑥ ベース</button>
      </div>

      <p id="modeMessage" class="mode-message"></p>
    </section>

    <section class="main-panel">
      <div class="controls">
        <button id="startButton" class="start-button">▶ スタート</button>
        <button id="pauseButton">⏸ いちじていし</button>
        <button id="stopButton">⏹ ストップ</button>

        <p class="control-title">はやさ</p>
        <button class="speed-button" data-speed="1600">🐢 ゆっくり</button>
        <button class="speed-button selected" data-speed="1100">🚶 ふつう</button>
        <button class="speed-button" data-speed="700">🏃 はやく</button>
      </div>

      <div class="note-area">
        <p id="actionMessage" class="small-message">ひかる おとを たたこう</p>
        <div id="currentNote" class="current-note note-mi">み</div>
      </div>

      <div id="waitingArea" class="waiting-area">
        <div class="face">😊</div>
        <p id="waitingText">まってね</p>
      </div>
    </section>

    <section class="melody-area">
      <p class="section-title">おとの ならび</p>
      <div id="melody" class="melody"></div>
    </section>

    <section id="colorInstrumentArea" class="xylophone-area">
      <p id="keyAreaTitle" class="section-title">もっきんを たたく ところ</p>

      <p class="high-label">たかい おと</p>
      <div class="high-xylophone">
        <div class="xylophone-key high-key key-do" data-note="ど↑">ど↑</div>
        <div class="xylophone-key high-key key-re" data-note="れ↑">れ↑</div>
        <div class="xylophone-key high-key key-mi" data-note="み↑">み↑</div>
      </div>

      <div class="xylophone">
        <div class="xylophone-key key-do" data-note="ど">ど</div>
        <div class="xylophone-key key-re" data-note="れ">れ</div>
        <div class="xylophone-key key-mi" data-note="み">み</div>
        <div class="xylophone-key key-fa" data-note="ふぁ">ふぁ</div>
        <div class="xylophone-key key-so" data-note="そ">そ</div>
        <div class="xylophone-key key-la" data-note="ら">ら</div>
        <div class="xylophone-key key-si" data-note="し">し</div>
      </div>

      <p id="bottomMessage" class="bottom-message">♪ ひかる ところの おとを たたこう！</p>
    </section>

    <section id="bassKeyboardArea" class="bass-area hidden">
      <p class="section-title">ベースで ひく けんばん</p>
      <div class="piano">
        <div class="white-key" data-bass-note="ど">ど</div>
        <div class="white-key" data-bass-note="れ">れ</div>
        <div class="white-key" data-bass-note="み">み</div>
        <div class="piano-key-group">
          <div class="white-key" data-bass-note="ふぁ">ふぁ</div>
          <div class="black-key" data-bass-note="ふぁ♯">ふぁ♯</div>
        </div>
        <div class="white-key" data-bass-note="そ">そ</div>
      </div>
      <p class="bottom-message">🎹 ひかる けんばんを ひこう！</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
